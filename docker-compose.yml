services:
  ollama:
    image: ollama/ollama:latest
    container_name: restaurant-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Pulling llama3 model..."
        ollama pull llama3
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  web:
    build: .
    container_name: restaurant-web
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: llama3
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro

volumes:
  ollama_data: